name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deterministic: new eslint-disable / @ts-ignore / @ts-expect-error / .skip / .only / .fixme fail here
      # unless verify/suppressions-baseline.json (a code-owner path) allows them.
      - run: pnpm check:suppressions
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # docs/ai/adr/0005-decision-log.md: format, time order and "not in the future" for decisions.tsv.
      - run: pnpm check:decisions
      - run: pnpm build

  # Independent verifier (docs/ai/adr/0004-verifier.md). Required check on the PR head SHA.
  # No path filter on purpose: a skipped required check stays pending forever.
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      VERIFY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-evidence
          path: |
            verify-report
            test-results
          retention-days: 14

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
